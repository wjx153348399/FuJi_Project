<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>{% if mode == "new" %}新增{% else %}编辑{% endif %}工站目录配置</title>
    <link rel="stylesheet" href="/static/style.css?v=dialog2">
  </head>
  <body>
    <main class="page narrow">
      <header class="toolbar">
        <div>
          <h1>{% if mode == "new" %}新增配置{% else %}编辑配置 #{{ form.id }}{% endif %}</h1>
          <p>共享盘根目录：{{ config.share.root }}</p>
        </div>
        <a class="small-link" href="/station-config">返回列表</a>
      </header>

      {% if error %}
        <section class="notice error">{{ error }}</section>
      {% endif %}
      {% if warning %}
        <section class="notice warn">{{ warning }}</section>
      {% endif %}

      <section class="form-panel">
        <form method="post" action="{% if mode == 'new' %}/station-config/new{% else %}/station-config/{{ form.id }}/edit{% endif %}" onsubmit="return confirmStationSave(this);">
          {% if allow_force_save %}
            <input type="hidden" name="confirm_missing_path" value="1">
          {% endif %}
          <label>
            <span>flow</span>
            <input name="flow" value="{{ form.flow }}" placeholder="可选，确认真实工站代码后填写，例如 A557 / A558">
            <small class="field-help warn-text">未确认真实工站代码时请留空，不要填写 AFC / OUTER / 文件名中的 AA01。</small>
          </label>

          <label>
            <span>工站显示名称</span>
            <input name="station_name" value="{{ form.station_name }}" placeholder="仅用于页面显示，例如 AFC / 图形后">
          </label>

          <label>
            <span>相对目录路径</span>
            <textarea name="directory_path" rows="4" required placeholder="只填写共享盘根目录下面的相对路径，不填写 \\server\share 或 C:\">{{ form.directory_path }}</textarea>
          </label>

          <div class="form-grid">
            <label>
              <span>状态</span>
              <select name="enabled">
                <option value="1" {% if form.enabled == "1" %}selected{% endif %}>启用</option>
                <option value="0" {% if form.enabled == "0" %}selected{% endif %}>停用</option>
              </select>
            </label>

            <label>
              <span>排序</span>
              <input name="sort_order" value="{{ form.sort_order }}" inputmode="numeric">
            </label>
          </div>

          <label>
            <span>备注</span>
            <textarea name="remark" rows="3" placeholder="用途、来源、确认人等">{{ form.remark }}</textarea>
          </label>

          <div class="form-actions">
            <button type="submit">{% if allow_force_save %}确认仍然保存{% else %}保存{% endif %}</button>
            <a class="small-link" href="/station-config">取消</a>
          </div>
        </form>
      </section>
    </main>
    <script>
      function confirmStationSave(form) {
        const flow = form.flow.value.trim();
        const enabled = form.enabled.value === "1";
        if (enabled && !flow) {
          return confirm("这条配置的 flow 为空，启用后上传时不会传工站代码。确认保存并启用？");
        }
        return confirm("确认保存这条工站目录配置？保存后会影响自动上传扫描目录。");
      }
    </script>
  </body>
</html>
